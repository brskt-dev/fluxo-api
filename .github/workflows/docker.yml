name: Build, Push & Release

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Determine tag based on branch
        id: version
        run: |
          BRANCH=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')
          echo "TAG=$BRANCH" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: brsktdev/fluxo-api:${{ steps.version.outputs.TAG }}

      - name: Create Git Tag for Release
        if: github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          VERSION="release-${SHORT_SHA}"
          echo "RELEASE_TAG=$VERSION" >> $GITHUB_ENV

          curl -X POST https://api.github.com/repos/${{ github.repository }}/git/refs \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d @- <<EOF
          {
            "ref": "refs/tags/$VERSION",
            "sha": "${{ github.sha }}"
          }
          EOF

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
